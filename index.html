<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Shmup</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#9ab;font:13px monospace}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center}
  #stage canvas{display:block;width:min(100vw,177vh);height:auto}
  #bar{padding:6px}
  button,label{background:#112;color:#9ab;border:1px solid #345;padding:3px 8px;cursor:pointer;font:inherit}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar">
  <label>Importa livello .json <input id="imp" type="file" accept=".json,application/json" multiple hidden></label>
  <button id="clr">Svuota shmup_waves</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<script>
(async () => {
const W = 960, H = 540, KEY = 'shmup_waves';

/* ---------- Livelli ---------- */
const DEMO = { id: 'demo', meta: 'livello di esempio', duration: '', entities: [
  'Slug_shell,0,true,Circular,0.5,200,100,5,1',
  'Slug_egg,6,true,Swoop,0.6,200,100,6,0.8',
  'Slug_shell,12,true,Lissajous,0.5,160,100,4,1',
  'BOSS1GREEN,20,true,Lissajous,0.5,133,1,1,1'
]};
const J = x => { if (typeof x !== 'string') return x; try { return JSON.parse(x); } catch { return null; } };
function loadLevels() {
  const raw = J(localStorage.getItem(KEY)); let a = [];
  if (Array.isArray(raw)) a = raw.map(J);
  else if (raw && Array.isArray(raw.entities)) a = [raw];
  else if (raw && typeof raw === 'object') a = Object.entries(raw).map(([k, v]) => { v = J(v); return v && { ...v, id: v.id || k }; });
  a = a.filter(l => l && Array.isArray(l.entities));
  return a.length ? a : [DEMO];
}
// nome,tempoSpawn,attivo,pattern,velocità,ampiezzaY,ampiezzaX,quantità,intervallo
function parseEnt(s) {
  const p = String(s).split(',').map(x => x.trim()); if (!p[0]) return null;
  return { name: p[0], t: +p[1] || 0, on: p[2] !== 'false', pat: p[3] || '', spd: +p[4] || 0.5,
           a: +p[5] || 100, b: +p[6] || 100, n: Math.max(1, +p[7] | 0), iv: +p[8] || 1 };
}
let levels = loadLevels(), sel = 0;
document.getElementById('imp').onchange = async e => {
  const cur = loadLevels().filter(l => l !== DEMO);
  for (const f of e.target.files) {
    const o = J(await f.text());
    if (o && Array.isArray(o.entities)) { o.id = o.id || f.name.replace(/\.json$/i, ''); cur.push(o); }
  }
  localStorage.setItem(KEY, JSON.stringify(cur)); levels = loadLevels(); sel = 0; e.target.value = '';
};
document.getElementById('clr').onclick = () => { localStorage.removeItem(KEY); levels = loadLevels(); sel = 0; };

/* ---------- Pixi ---------- */
const app = new PIXI.Application();
await app.init({ width: W, height: H, background: 0x03030c, antialias: true });
document.getElementById('stage').appendChild(app.canvas);
const bg = new PIXI.Container(), world = new PIXI.Container(), ui = new PIXI.Container();
app.stage.addChild(bg, world, ui);
const T = (s, x, y, size, c) => {
  const t = new PIXI.Text({ text: s, style: { fill: 0xdfe9ff, fontFamily: 'monospace', fontSize: size, align: 'center' } });
  if (c) t.anchor.set(0.5); t.position.set(x, y); ui.addChild(t); return t;
};
const hud = T('', 12, 8, 16), msg = T('', W / 2, H / 2, 22, true);
const stars = [];
for (let i = 0; i < 90; i++) {
  const l = 1 + i % 3, g = new PIXI.Graphics().rect(0, 0, l, l).fill(0xffffff);
  g.alpha = .25 + l * .2; g.position.set(Math.random() * W, Math.random() * H); g.sp = l * 40;
  bg.addChild(g); stars.push(g);
}

/* ---------- Input (tastiera + gamepad) ---------- */
const K = {}, prev = {};
addEventListener('keydown', e => { K[e.code] = 1; if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => { K[e.code] = 0; });
const edge = (k, v) => { const r = v && !prev[k]; prev[k] = v; return r; };
function input() {
  const i = { x: 0, y: 0, fire: !!(K.Space || K.KeyZ || K.KeyX), up: !!(K.ArrowUp || K.KeyW), down: !!(K.ArrowDown || K.KeyS), ok: !!(K.Enter || K.Space) };
  if (K.ArrowLeft || K.KeyA) i.x--; if (K.ArrowRight || K.KeyD) i.x++;
  if (i.up) i.y--; if (i.down) i.y++;
  const g = [...(navigator.getGamepads?.() || [])].find(Boolean);
  if (g) {
    const b = n => !!g.buttons[n]?.pressed, ax = g.axes[0] || 0, ay = g.axes[1] || 0;
    if (Math.abs(ax) > .2) i.x += ax; if (Math.abs(ay) > .2) i.y += ay;
    if (b(14)) i.x--; if (b(15)) i.x++; if (b(12)) i.y--; if (b(13)) i.y++;
    i.fire = i.fire || b(0) || b(2) || b(7); i.ok = i.ok || b(0) || b(9);
    i.up = i.up || b(12) || ay < -.5; i.down = i.down || b(13) || ay > .5;
  }
  i.x = Math.max(-1, Math.min(1, i.x)); i.y = Math.max(-1, Math.min(1, i.y));
  return i;
}

/* ---------- Gioco ---------- */
let st = 'menu', pl, bul = [], eb = [], en = [], fx = [], q = [], lt = 0, score = 0, lives = 3, lvl;
const col = n => /GREEN/i.test(n) ? 0x44ff77 : /egg/i.test(n) ? 0xffd866 : /shell/i.test(n) ? 0xff7a59 : 0xc77dff;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function start() {
  world.removeChildren(); bul = []; eb = []; en = []; fx = []; q = []; lt = 0; score = 0; lives = 3;
  lvl = levels[sel];
  for (const s of lvl.entities) {
    const d = parseEnt(s); if (!d || !d.on) continue;
    d.y0 = 60 + Math.random() * (H - 120);
    for (let k = 0; k < d.n; k++) q.push({ d, time: d.t + k * d.iv });
  }
  q.sort((a, b) => a.time - b.time);
  const g = new PIXI.Graphics().poly([22, 0, -14, -13, -8, 0, -14, 13]).fill(0x66e0ff).rect(-18, -3, 6, 6).fill(0xff9d3c);
  world.addChild(g); pl = { g, x: 90, y: H / 2, cd: 0, inv: 0 }; g.position.set(pl.x, pl.y);
  st = 'play';
}
function mkB(list, x, y, vx, vy, c, r) {
  const g = new PIXI.Graphics().circle(0, 0, r).fill(c); g.position.set(x, y); world.addChild(g);
  list.push({ g, x, y, vx, vy, r });
}
function spawn(d) {
  const boss = /^BOSS/i.test(d.name), r = boss ? 46 : 16;
  const g = new PIXI.Graphics().circle(0, 0, r).fill(col(d.name)).circle(-r * .3, 0, r * .3).fill(0x10101a);
  if (boss) g.rect(-r - 8, -6, 12, 12).fill(0xffffff);
  const ry = boss ? d.a : d.a * .5, rx = boss ? d.b * 40 : d.b * .5;   // boss: ampiezzaX in unità da 40px
  const y0 = boss ? H / 2 : Math.max(ry + 30, Math.min(H - ry - 30, d.y0));
  world.addChild(g);
  en.push({ g, d, boss, r, x: W + r + 10, sx: W + r + 10, y: y0, y0, rx, ry, t: 0, hp: boss ? 60 : 3, cd: 1 + Math.random() * 2 });
}
function boom(x, y, big) {
  const g = new PIXI.Graphics().circle(0, 0, big ? 40 : 16).fill(0xffc34d); g.position.set(x, y); world.addChild(g);
  fx.push({ g, t: 0, life: big ? .6 : .3 });
}
function hit() {
  if (pl.inv > 0) return; lives--; pl.inv = 1.8; boom(pl.x, pl.y, false);
  if (lives <= 0) st = 'over';
}
function fire(e) {
  const a = Math.atan2(pl.y - e.y, pl.x - e.x);
  for (const o of e.boss ? [-.25, 0, .25] : [0]) mkB(eb, e.x, e.y, Math.cos(a + o) * 230, Math.sin(a + o) * 230, 0xff4466, 5);
}

function play(dt) {
  const i = input(); lt += dt;
  while (q.length && q[0].time <= lt) spawn(q.shift().d);

  pl.x = Math.max(20, Math.min(W - 20, pl.x + i.x * 320 * dt));
  pl.y = Math.max(16, Math.min(H - 16, pl.y + i.y * 320 * dt));
  pl.g.position.set(pl.x, pl.y);
  pl.inv = Math.max(0, pl.inv - dt); pl.g.alpha = pl.inv > 0 && (pl.inv * 10 | 0) % 2 ? .3 : 1;
  if ((pl.cd -= dt) <= 0 && i.fire) { pl.cd = .13; mkB(bul, pl.x + 22, pl.y, 700, 0, 0xfff27a, 3); }

  for (const e of en) {
    e.t += dt; const t = e.t, v = e.d.spd * 120;
    let bx = e.sx - v * t; if (e.boss) bx = Math.max(W - 150, bx);
    let ox = 0, oy = 0;
    if (e.d.pat === 'Circular') { ox = e.rx * (Math.cos(2 * t) - 1); oy = e.ry * Math.sin(2 * t); }
    else if (e.d.pat === 'Swoop') oy = e.ry * Math.sin(1.6 * t);
    else if (e.d.pat === 'Lissajous') { ox = e.rx * Math.sin(3 * t); oy = e.ry * Math.sin(2 * t); }
    e.x = bx + ox; e.y = e.y0 + oy; e.g.position.set(e.x, e.y);
    if (e.x < W - 10 && (e.cd -= dt) <= 0) { e.cd = e.boss ? .8 : 2 + Math.random() * 2; fire(e); }
    if (!e.boss && e.x < -e.r - 40) e.dead = true;
    if (!e.dead && dist(e, pl) < e.r + 10) { hit(); if (!e.boss) { e.dead = true; boom(e.x, e.y); } }
  }
  for (const b of bul) {
    b.x += b.vx * dt; b.g.x = b.x;
    if (b.x > W + 10) b.dead = true;
    for (const e of en) if (!b.dead && !e.dead && dist(b, e) < e.r + b.r) {
      b.dead = true; e.hp--;
      if (e.hp <= 0) { e.dead = true; score += e.boss ? 1000 : 100; boom(e.x, e.y, e.boss); }
    }
  }
  for (const b of eb) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.g.position.set(b.x, b.y);
    if (b.x < -10 || b.x > W + 10 || b.y < -10 || b.y > H + 10) b.dead = true;
    else if (dist(b, pl) < b.r + 8) { b.dead = true; hit(); }
  }
  for (const f of fx) { f.t += dt; f.g.scale.set(1 + f.t * 3); f.g.alpha = Math.max(0, 1 - f.t / f.life); if (f.t >= f.life) f.dead = true; }
  for (const arr of ['bul', 'eb', 'en', 'fx']) {
    const list = { bul, eb, en, fx }[arr];
    for (const o of list) if (o.dead) o.g.destroy();
  }
  bul = bul.filter(o => !o.dead); eb = eb.filter(o => !o.dead); en = en.filter(o => !o.dead); fx = fx.filter(o => !o.dead);

  hud.text = `SCORE ${score}   VITE ${Math.max(0, lives)}   ${lvl.id || 'level'}${lvl.meta ? ' · ' + lvl.meta : ''}`;
  if (st === 'play' && !q.length && !en.length && lt >= (+lvl.duration || 0)) st = 'win';
}

app.ticker.add(tk => {
  const dt = Math.min(.05, tk.deltaMS / 1000);
  for (const s of stars) { s.x -= s.sp * dt; if (s.x < -2) { s.x = W + 2; s.y = Math.random() * H; } }
  const i = input(), ok = edge('ok', i.ok), up = edge('up', i.up), dn = edge('dn', i.down);
  if (st === 'menu') {
    if (up) sel = (sel + levels.length - 1) % levels.length;
    if (dn) sel = (sel + 1) % levels.length;
    hud.text = '';
    msg.text = 'SPACE SHMUP\n\n' + levels.map((l, n) => `${n === sel ? '>' : ' '} ${l.id || 'level ' + (n + 1)}${l.meta ? ' (' + l.meta + ')' : ''}  [${l.entities.length}]`).join('\n')
             + '\n\n↑↓ scegli · Invio / Spazio / A = start\nFrecce/WASD + Spazio · oppure Gamepad';
    if (ok) { msg.text = ''; start(); }
  } else if (st === 'play') { msg.text = ''; play(dt); }
  else {
    msg.text = (st === 'win' ? 'LIVELLO COMPLETATO' : 'GAME OVER') + `\nScore ${score}\n\nInvio / A per tornare al menu`;
    play(dt * 0 + 0.0001);
    if (ok) { world.removeChildren(); st = 'menu'; }
  }
});
})();
</script>
</body>
</html>
