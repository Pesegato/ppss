<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space Shmup - Simonetta Engine</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #9ab; font: 13px monospace; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #stage canvas { display: block; width: min(100vw, 177vh); height: auto; }
    #bar { padding: 6px; display: flex; gap: 8px; align-items: center; }
    button, label { background: #112; color: #9ab; border: 1px solid #345; padding: 4px 10px; cursor: pointer; font: inherit; border-radius: 4px; }
    button:hover, label:hover { background: #1a1a3a; color: #fff; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="bar">
    <label>Importa Wave .json <input id="imp" type="file" accept=".json,application/json" multiple hidden></label>
    <button id="clr">Svuota shmup_waves</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
